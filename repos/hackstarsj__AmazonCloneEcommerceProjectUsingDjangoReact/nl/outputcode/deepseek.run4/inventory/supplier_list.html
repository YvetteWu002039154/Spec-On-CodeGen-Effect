{% extends 'base.html' %}
{% block content %}
<h2>Suppliers</h2>
<table class="table">
  <thead><tr><th>Name</th><th>Contact</th><th>Email</th><th>Phone</th></tr></thead>
  <tbody>
    {% for supplier in suppliers %}
      <tr>
        <td>{{ supplier.name }}</td>
        <td>{{ supplier.contact_person }}</td>
        <td>{{ supplier.email }}</td>
        <td>{{ supplier.phone }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
