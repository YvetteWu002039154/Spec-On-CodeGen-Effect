{% extends 'base.html' %}
{% block content %}
<h2>Checkout</h2>
<div class="row">
  <div class="col-md-8">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success">Place Order</button>
    </form>
  </div>
  <div class="col-md-4">
    <h4>Order Summary</h4>
    <ul class="list-group">
      {% for item in cart %}
        <li class="list-group-item d-flex justify-content-between">
          <span>{{ item.product.name }} (x{{ item.quantity }})</span>
          <span>${{ item.total_price }}</span>
        </li>
      {% endfor %}
      <li class="list-group-item d-flex justify-content-between">
        <strong>Total</strong>
        <strong>${{ cart.get_total_price }}</strong>
      </li>
    </ul>
  </div>
</div>
{% endblock %}
