{% extends 'base.html' %}
{% block content %}
<h2>Order History</h2>
{% if orders %}
  <table class="table">
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Date</th>
        <th>Status</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
      {% for order in orders %}
        <tr>
          <td><a href="{% url 'orders:order_detail' order.id %}">#{{ order.id }}</a></td>
          <td>{{ order.created }}</td>
          <td>{{ order.get_status_display }}</td>
          <td>${{ order.total }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <p>No orders yet.</p>
{% endif %}
{% endblock %}
